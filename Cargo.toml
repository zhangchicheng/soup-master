[package]
name = "soup-master"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18", default-features = false, features = ["2d", "png", "wav"] }
bevy_tweening = "0.15"
serde = { version = "1", features = ["derive"] }
ron = "0.10"
serde_json = "1"
rand = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.128"
web-sys = { version = "0.3.105", features = ["Window", "Storage"] }

[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# The build environment has no crates.io network access and lacks this tiny
# platform helper. Forward its sole webgl feature locally; wgpu itself is unchanged.
[patch.crates-io]
wgpu-core-deps-wasm = { path = "vendor/wgpu-core-deps-wasm" }
